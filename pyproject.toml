[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gamemaker-graph"
version = "0.6.0"
description = "Local project graph and documentation context for vibe game development"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GameMakerGraph contributors" }]
dependencies = []

[project.scripts]
gamegraph = "gamemaker_graph.cli:main"
gamegraph-mcp = "gamemaker_graph.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[dependency-groups]
dev = [
  "mcp>=2,<3",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--basetemp=.pytest"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
